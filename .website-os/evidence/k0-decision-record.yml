hold_reason: >-
  Fresh repository/build inspection found existing indexable editorial URLs that overlap package registration, comparison, one-day and audience intents.
  A current Search Console query/page export was not available in this execution, so replacing, redirecting or merging those existing URLs would violate the existing-site preservation rule.
  K0 therefore remains HOLD until the existing URL ownership conflicts are resolved with evidence; new expansion URLs must not be published.
