  - inventory every existing indexable URL against the keyword/intent map
  - select keep/update/merge/redirect/noindex/retarget for each high-risk collision
  - preserve any URL with meaningful existing search performance unless evidence supports migration
  - update url-ownership-map.csv and cannibalization-register.csv to reflect final owners
  - rerun the Website OS K0 enforcement engine and retain machine evidence
expansion_gates:
