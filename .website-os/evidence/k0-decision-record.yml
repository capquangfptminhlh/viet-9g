  require_duplicate_cannibalization_check: true
  require_canonical_slug_decision: true
  require_internal_link_plan: true
  require_content_type_assignment: true
refresh:
  max_serp_age_days: 45
  triggers:
    - Search Console query/page export becomes available
    - material Viettel package, price, benefit, eligibility or policy change
    - new search intent or SERP composition materially differs
    - proposed URL is promoted from HOLD to indexable
notes:
  - HOLD is intentional and blocks content scaling; it is not a request to publish for quota.
  - Historical K0 workbook records are supporting history only and do not override current repo/SERP evidence.
  - No search volume, KD, CPC, ranking or traffic-potential number is asserted without source provenance.
