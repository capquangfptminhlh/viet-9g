    disposition: SKIP_NO_MATERIAL_PRIMARY_SOURCE_UPDATE
    reason: "Fresh first-party search did not surface a same-day Viettel telecom announcement with a distinct publishable search job. The freshest 21/08 TV360 promotion is outside the core mobile-support acquisition scope."
  - candidate: "roaming Viettel / chọn mạng / VoLTE khi roaming"
    disposition: SKIP_EXISTING_CLUSTER_OR_STALE_GUIDE
    reason: "Official guidance exists, including Japan 4G/5G roaming and network-selection documents, but these jobs are already represented by the roaming cluster and did not present a stronger distinct gap than the selected support intent."
  - candidate: "hạn sử dụng SIM Viettel / thời gian giữ số"
    disposition: SKIP_PROCEDURE_EVIDENCE_INCOMPLETE
    reason: "Current Viettel contract terms confirm that service validity and number-retention periods exist by package, but do not provide one universal duration/check procedure that can safely be asserted for all prepaid subscribers."
  - candidate: "chuyển tiền I-Share / nạp thẻ hộ Viettel"
    disposition: SKIP_CURRENT_TRANSACTION_EVIDENCE_WEAK
    reason: "No sufficiently current first-party transactional procedure, fee and eligibility evidence was found in this run for a reliable how-to."
  - candidate: "Android/eSIM compatibility"
    disposition: SKIP_EXISTING_OWNER
    reason: "The repository already has a canonical Android eSIM compatibility owner; creating another URL would duplicate the same search job."
  - candidate: "mất SIM Viettel / cấp lại SIM mới / khóa chiều đi"
    disposition: SELECT_NEW_CANONICAL_OWNER
    reason: "Viettel's recently published prepaid mobile general terms explicitly state that a customer who loses a SIM must go to a Viettel transaction point or use My Viettel to request a replacement SIM, may request outgoing-service suspension, and may call 18008098 for urgent outgoing-call blocking. Repository search found no existing article owner for this lost-SIM recovery job."
