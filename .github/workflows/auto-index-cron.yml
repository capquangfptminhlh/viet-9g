name: Daily Google Auto-Index Cron

on:
  schedule:
    - cron: '0 17 * * *' # Chạy vào lúc 17:00 UTC (tức 00:00 giờ Việt Nam) hàng ngày
  workflow_dispatch: # Cho phép kích hoạt thủ công bằng nút bấm trên GitHub

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create Service Account File
        run: echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}" > scripts/service-account.json

      - name: Execute Auto-Index Script
        run: node scripts/auto-index.js
