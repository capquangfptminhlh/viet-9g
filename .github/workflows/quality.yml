name: SEO AEO GEO Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-aeo-geo-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and policy tests
        run: npm test

      - name: Validate active keyword-intelligence approval (K0)
        run: npm run k0:check

      - name: Static build and SEO/AEO/GEO gate
        run: npm run build

      - name: Verify built editorial HTML and image
        run: node scripts/verify-editorial-html.mjs

      - name: Verify mobile CTA source contract
        run: node scripts/verify-mobile-cta-source.mjs

      - name: Install headless Chromium for real mobile measurement
        run: |
          npm install --global --no-audit --no-fund playwright@1.55.0
          playwright install chromium

      - name: Measure real 390x844 mobile layout and CTA targets
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/viettel-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4321/tin-tuc; then break; fi
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:4321/posts/5gip200-viettel-iphone
          PLAYWRIGHT_MODULE_PATH="$(npm root -g)/playwright" node scripts/verify-mobile-runtime.mjs

      - name: Upload browser-measured mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-mobile-390x844
          path: .website-os/out/mobile-390x844.json
          if-no-files-found: warn

      - name: Gate any newly generated or modified article on editorial evidence
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/verify-article-release.mjs

      - name: Prepare provenance from built editorial artifacts
        run: node scripts/prepare-editorial-evidence.mjs

      # The private seo-web handbook is read by the connected maintainer agent.
      # GitHub Actions does not inherit the agent's GitHub credentials.
      # This public-repo CI runs its own deterministic source-ready gates.
      - name: Verify editorial evidence without private-repo credentials
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-editorial-html.mjs
          node scripts/prepare-editorial-evidence.mjs
          test -s .website-os/out/editorial-artifact/provenance.json
          echo "PASS: project-local editorial HTML, media, and provenance checks" >> "$GITHUB_STEP_SUMMARY"
          echo "Central private Website OS engine was not executed in this workflow." >> "$GITHUB_STEP_SUMMARY"
          echo "Production publication requires separate live verification." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish project-local editorial summary
        if: always()
        shell: bash
        run: |
          if [[ -f .website-os/out/website-os-summary.md ]]; then
            cat .website-os/out/website-os-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload project-local editorial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-project-evidence
          path: |
            .website-os/out/editorial-artifact/provenance.json
          if-no-files-found: warn
