name: SEO AEO GEO Quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-aeo-geo-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and policy tests
        run: npm test

      - name: Validate active keyword-intelligence approval (K0)
        run: npm run k0:check

      - name: Static build and SEO/AEO/GEO gate
        run: npm run build

      - name: Verify built editorial HTML and image
        run: node scripts/verify-editorial-html.mjs

      - name: Prepare provenance from built editorial artifacts
        run: node scripts/prepare-editorial-evidence.mjs
