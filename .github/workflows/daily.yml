name: Antigravity Daily SEO/AEO Pipeline

on:
  # schedule (disabled by user):
    # 18:00 UTC = 01:00 AM Asia/Ho_Chi_Minh (UTC+7)
    # - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: seo-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  run-pipeline:
    name: "Run SEO/AEO Autonomous Pipeline"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Validate Package Catalog
        run: npm run validate:catalog

      - name: Check Package Catalog Drift
        run: npm run check:catalog

      - name: Validate keyword-intelligence approval (K0)
        run: npm run k0:check

      - name: Run Unified Orchestrator Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx tsx pipeline/daily.ts
          
      - name: Build Astro Static Site Check
        run: npm run build

      - name: Create Feature Branch and Push PR (Release Protocol)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          BRANCH_NAME="feature/seo-content-$(date +'%Y%m%d-%H%M%S')"
          
          if [ -n "$(git status --porcelain)" ]; then
            git checkout -b "$BRANCH_NAME"
            git add .
            git commit -m "feat(seo): add daily generated content and assets"
            git push origin "$BRANCH_NAME"
            
            gh pr create \
              --title "feat(seo): Daily Content Release $(date +'%Y-%m-%d')" \
              --body "Automated daily content release generated by Antigravity SEO/AEO Pipeline. Includes verification report and packaged assets." \
              --base main \
              --head "$BRANCH_NAME"
          else
            echo "No content changes to release via PR."
          fi
