name: Auto-Generate Daily SEO Blog Post

on:
  schedule:
    # 17:00 UTC = 00:00 midnight Vietnam Time (UTC+7)
    - cron: '0 17 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI if needed

permissions:
  contents: write

jobs:
  auto-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Auto-Blog Generator
        run: |
          node scripts/auto-generate-blog.cjs

      - name: Commit and Push New Article
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/posts/*.md
          if git diff --staged --quiet; then
            echo "No new blog post to commit."
          else
            git commit -m "feat(blog): auto-generate daily SEO article [skip ci]"
            git push origin main
            echo "Successfully pushed new SEO article to main."
          fi
