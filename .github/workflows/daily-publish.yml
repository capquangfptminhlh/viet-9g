name: Daily Auto Publish

on:
  schedule:
    # 07:00 Asia/Ho_Chi_Minh
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Verify policy and content gates
        run: npm test -- tests/main-site tests/blogger

      - name: Validate keyword-intelligence approval (K0)
        run: npm run k0:check

      - name: Generate one verified main-site article
        run: npx tsx scripts/auto-main-site.ts

      - name: Commit generated article and ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/posts state/main-site-publication-ledger.json
          git commit -m "content: publish verified main-site article [skip ci]" || exit 0
          git push
