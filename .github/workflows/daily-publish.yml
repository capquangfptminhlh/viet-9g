name: Daily SEO production monitor (ChatGPT authors content)

on:
  schedule:
    # 07:00 Asia/Ho_Chi_Minh: verify site/article status without generating templated articles.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-editorial-monitor-main
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout production main (read-only)
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify editorial monitor unit tests and approved K0
        run: |
          npm test -- tests/editorial/daily-editorial-status.test.ts
          npm run k0:check
      - name: Audit pending sources and canonical ownership
        run: node scripts/daily-editorial-status.mjs audit
      - name: Check real production article URLs
        if: always()
        run: node scripts/daily-editorial-status.mjs live
      - name: Upload auditable readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-editorial-monitor
          path: |
            .website-os/out/daily-editorial-readiness.json
            .website-os/out/daily-live-publication.json
          if-no-files-found: warn
      - name: Notify actual status (ChatGPT task handles content separately)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EDITORIAL_JOB_STATUS: ${{ job.status }}
        run: node scripts/daily-editorial-status.mjs notify
