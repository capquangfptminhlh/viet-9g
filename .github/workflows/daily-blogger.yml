name: Blogger Owned Media Draft

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "20 19 * * *" # 02:20 AM Asia/Ho_Chi_Minh (19:20 UTC)

permissions:
  contents: write

jobs:
  create-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: blogger-draft
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test -- tests/blogger
      - name: Generate one Blogger draft
        run: npx tsx scripts/auto-blogger.ts
        env:
          BLOGGER_ENABLED: "true"
          BLOGGER_MAX_POSTS_PER_RUN: "1"
          BLOGGER_OAUTH_CLIENT_ID: ${{ secrets.BLOGGER_OAUTH_CLIENT_ID }}
          BLOGGER_OAUTH_CLIENT_SECRET: ${{ secrets.BLOGGER_OAUTH_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      - name: Persist Idempotency Ledger back to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state/blogger-publication-ledger.json
          git diff --cached --quiet || (git commit -m "chore(state): update blogger publication ledger [skip ci]" && git push origin main)
