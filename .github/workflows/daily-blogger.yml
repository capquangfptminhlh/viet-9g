name: Blogger Owned Media Publish

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # 07:00 Asia/Ho_Chi_Minh (00:00 UTC)

permissions:
  contents: read

concurrency:
  group: blogger-auto-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: blogger-draft
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test -- tests/blogger
      - name: Validate Blogger OAuth before ledger reservation
        run: npx tsx scripts/blogger-auth-preflight.ts
        env:
          BLOGGER_OAUTH_CLIENT_ID: ${{ secrets.BLOGGER_OAUTH_CLIENT_ID }}
          BLOGGER_OAUTH_CLIENT_SECRET: ${{ secrets.BLOGGER_OAUTH_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      - name: Validate keyword-intelligence approval (K0)
        run: npm run k0:check
      - name: Publish one Blogger post
        run: npx tsx scripts/auto-blogger.ts
        env:
          BLOGGER_ENABLED: "true"
          BLOGGER_MAX_POSTS_PER_RUN: "1"
          BLOGGER_OAUTH_CLIENT_ID: ${{ secrets.BLOGGER_OAUTH_CLIENT_ID }}
          BLOGGER_OAUTH_CLIENT_SECRET: ${{ secrets.BLOGGER_OAUTH_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
