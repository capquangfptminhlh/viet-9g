name: Auto-SEO Content Factory

on:
  schedule:
    # Chạy lúc 17:00 UTC (tức 00:00 sáng giờ VN hằng ngày)
    - cron: '0 17 * * *'
  # Cho phép bấm chạy bằng tay từ Github UI để kiểm tra
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-seo-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run AI Content Generator
        env:
          # Cần add API KEY vào Github Secrets
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node scripts/generate-content.js || echo "Script generated no new post today."

      - name: Commit Generated Markdown
        run: |
          git config --global user.name "Hạm Đội SEO (Bot)"
          git config --global user.email "bot@tracuugoicuoc.com"
          git add public/posts/ src/data/
          git commit -m "feat(seo): auto-generated AEO post [skip ci]" || echo "No Markdown changes to commit"

      - name: Build Static Site (Generates Sitemap & RSS)
        run: npm run build

      - name: Force Indexing API
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
        run: |
          node scripts/idx-14-indexnow.js || echo "Index API skipped or failed"

      - name: Push All Changes
        run: |
          git push origin main
