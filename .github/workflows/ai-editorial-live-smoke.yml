name: AI Viettel original editorial live smoke

on:
  push:
    branches:
      - fix/editorial-daily-readiness-telemetry-20261118
    paths:
      - .github/workflows/ai-editorial-live-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-original-editorial-one-off-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/fix/editorial-daily-readiness-telemetry-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Fetch real official Viettel article and verify custom SVG rendering
        run: |
          node scripts/verify-viettel-source-svg.mjs
          python3 -c 'import xml.etree.ElementTree as ET; ET.parse(".website-os/out/source-smoke/illustration.svg"); print("SVG_XML_WELL_FORMED=PASS")'
      - name: Run live Viettel research, real Gemini and original SVG creation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_EDITORIAL_MODEL: ${{ vars.GEMINI_EDITORIAL_MODEL }}
        run: node scripts/ai-daily-editorial.mjs
      - name: Fail if actual article/illustration were not generated
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const file=".website-os/out/ai-editorial-creation.json"; if (!fs.existsSync(file)) throw Error("NO_LIVE_CREATION_EVIDENCE"); const j=JSON.parse(fs.readFileSync(file,"utf8")); console.log("LIVE_AI_SMOKE_STATUS="+j.status); if(j.status!=="STAGED_FOR_REVIEW") throw Error("AI_INTEGRATION_HOLD: "+(j.reason||"UNKNOWN"));'
      - name: Build actual generated article HTML and validate own SVG
        run: |
          npm run build
          node scripts/verify-ai-editorial-artifacts.mjs
      - name: Save live AI/sourcing evidence and generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-original-editorial-live-smoke
          path: |
            .website-os/out/ai-editorial-creation.json
            .website-os/out/source-smoke/*
            src/content/posts/*.md
            public/images/editorial/*.svg
          retention-days: 2
          if-no-files-found: warn
