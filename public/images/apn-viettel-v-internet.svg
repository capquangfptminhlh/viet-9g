<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Cấu hình APN Viettel v-internet cho 4G và 5G</title>
  <desc id="desc">Minh họa điện thoại đang mở phần cài đặt APN Viettel với giá trị v-internet và kết nối dữ liệu 4G 5G.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b0000"/><stop offset="1" stop-color="#e60000"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="170" fill="#ffffff" opacity=".07"/>
  <circle cx="100" cy="630" r="220" fill="#ffffff" opacity=".06"/>
  <g transform="translate(85 95)">
    <text x="0" y="46" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#fecaca">VIETTEL 4G / 5G</text>
    <text x="0" y="115" font-family="Arial, sans-serif" font-size="55" font-weight="800" fill="#ffffff">KIỂM TRA APN</text>
    <text x="0" y="174" font-family="Arial, sans-serif" font-size="43" font-weight="800" fill="#ffffff">v-internet</text>
    <text x="0" y="232" font-family="Arial, sans-serif" font-size="23" fill="#fee2e2">Có sóng nhưng không vào được dữ liệu?</text>
    <g transform="translate(0 282)">
      <rect width="430" height="58" rx="29" fill="#ffffff" opacity=".14"/>
      <circle cx="32" cy="29" r="9" fill="#ffffff"/>
      <text x="55" y="37" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Mobile Data → APN → v-internet</text>
    </g>
  </g>
  <g transform="translate(690 62)">
    <rect x="0" y="0" width="350" height="550" rx="46" fill="#111827"/>
    <rect x="15" y="18" width="320" height="514" rx="34" fill="url(#card)"/>
    <rect x="120" y="31" width="110" height="20" rx="10" fill="#111827"/>
    <text x="44" y="98" font-family="Arial, sans-serif" font-size="25" font-weight="800" fill="#111827">Mạng di động</text>
    <text x="44" y="145" font-family="Arial, sans-serif" font-size="16" fill="#64748b">SIM Viettel</text>
    <line x1="44" y1="165" x2="306" y2="165" stroke="#e2e8f0"/>
    <text x="44" y="212" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#334155">Tên điểm truy cập (APN)</text>
    <rect x="44" y="238" width="262" height="92" rx="14" fill="#fff1f2" stroke="#ef4444" stroke-width="2"/>
    <text x="62" y="270" font-family="Arial, sans-serif" font-size="15" fill="#64748b">APN</text>
    <text x="62" y="307" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#b91c1c">v-internet</text>
    <text x="44" y="380" font-family="Arial, sans-serif" font-size="16" fill="#64748b">Dữ liệu di động</text>
    <rect x="242" y="358" width="64" height="34" rx="17" fill="#22c55e"/>
    <circle cx="289" cy="375" r="13" fill="#ffffff"/>
    <g transform="translate(44 424)">
      <rect width="114" height="44" rx="22" fill="#e60000"/>
      <text x="27" y="29" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff">4G LTE</text>
      <rect x="132" width="88" height="44" rx="22" fill="#111827"/>
      <text x="159" y="29" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#ffffff">5G</text>
    </g>
  </g>
  <text x="85" y="630" font-family="Arial, sans-serif" font-size="18" fill="#fecaca">Minh họa hướng dẫn cấu hình — không phải ảnh chụp màn hình thiết bị cụ thể</text>
</svg>