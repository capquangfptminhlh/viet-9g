    <text x="165" y="82" font-family="Arial, sans-serif" font-size="40" font-weight="800" fill="#166534">Nhóm trả phí được nêu</text>
    <text x="165" y="135" font-family="Arial, sans-serif" font-size="31" fill="#374151">Miễn 100% data 4G/5G khi dùng TV360</text>
