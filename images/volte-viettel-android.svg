<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">VoLTE Viettel trên Android</title>
  <desc id="desc">Minh họa điện thoại Android đang gọi VoLTE trên mạng Viettel 4G và 5G.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7f1d1d"/>
      <stop offset="0.52" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="160" r="250" fill="#fff" opacity=".06"/>
  <circle cx="1450" cy="760" r="360" fill="#fff" opacity=".04"/>
  <g transform="translate(150 160)">
    <rect x="0" y="0" width="785" height="580" rx="42" fill="#fff" opacity=".08"/>
    <text x="70" y="125" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">HƯỚNG DẪN VIETTEL 2026</text>
    <text x="70" y="240" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="900">BẬT VoLTE</text>
    <text x="70" y="340" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="900">TRÊN ANDROID</text>
    <text x="70" y="420" fill="#fecaca" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Samsung • Xiaomi • Oppo • Realme</text>
    <g transform="translate(70 470)">
