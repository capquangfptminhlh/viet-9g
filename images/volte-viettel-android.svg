      <text x="180" y="43" text-anchor="middle" fill="#b91c1c" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">HDCALL → 191</text>
    </g>
  </g>
  <g transform="translate(1040 100)" filter="url(#shadow)">
    <rect x="0" y="0" width="380" height="700" rx="62" fill="#0f172a"/>
    <rect x="18" y="18" width="344" height="664" rx="50" fill="url(#screen)"/>
    <rect x="132" y="34" width="116" height="22" rx="11" fill="#111827"/>
    <text x="190" y="135" text-anchor="middle" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800">Viettel</text>
    <g transform="translate(82 190)">
      <circle cx="108" cy="108" r="108" fill="#dc2626"/>
      <path d="M79 72c18 37 45 64 82 82l29-29c4-4 10-5 15-3 17 6 35 9 54 9 8 0 14 6 14 14v46c0 8-6 14-14 14C148 205 57 114 57 2c0-8 6-14 14-14h46c8 0 14 6 14 14 0 19 3 37 9 54 2 5 1 11-3 15l-29 29z" fill="#fff" transform="translate(-43 12) scale(.72)"/>
    </g>
    <text x="190" y="465" text-anchor="middle" fill="#b91c1c" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="900">VoLTE</text>
    <text x="190" y="515" text-anchor="middle" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Cuộc gọi trên 4G / 5G</text>
    <g transform="translate(65 565)">
